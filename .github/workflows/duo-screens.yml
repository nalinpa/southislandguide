# Screenshots the app on the iPhone Duo simulator (GitHub's free xcode-27 runner).
# The push trigger is for building only; Task 6 removes it.
name: duo-screens
on:
  push:
    branches: [duo-screens]
  workflow_dispatch:
    inputs:
      elements:
        description: "Also save each screen's element list"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  screens:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP_ID: app.blacksands.southislandguide
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pick the iPhone Duo and start it booting
        run: |
          mkdir -p shots
          echo "start $(date +%T)" | tee shots/report.txt
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          duos = [(r, x['udid']) for r, v in d.items() for x in v if x['name'] == 'iPhone Duo']
          duos.sort(key=lambda t: '27-1' not in t[0])
          print(duos[0][1])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "DUOCTL_UDID=$UDID" >> "$GITHUB_ENV"
          echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>&1 || true
          echo "boot started $(date +%T)" | tee -a shots/report.txt

      - name: Install duoctl and AXe (pinned files, sha256 checked) while the sim boots
        run: |
          curl -fsSL https://github.com/skarol/duoctl/archive/refs/tags/v0.2.1.tar.gz -o duoctl.tar.gz
          echo "32332f5ae653e857e94c845c71a29d6a8056c550cf4f839a51830d0330026f77  duoctl.tar.gz" | shasum -a 256 -c
          mkdir -p duoctl-src && tar -xzf duoctl.tar.gz -C duoctl-src --strip-components 1
          chmod +x duoctl-src/skills/duoctl/scripts/duoctl
          echo "$PWD/duoctl-src/skills/duoctl/scripts" >> "$GITHUB_PATH"
          echo "duoctl ready $(date +%T)" | tee -a shots/report.txt
          curl -fsSL https://github.com/cameroncooke/AXe/releases/download/v2.1.1/AXe-macOS-v2.1.1-universal.tar.gz -o axe.tar.gz
          echo "8788838b1b32059d143cf06541b72fcaead85c16274457cdbff086510a5b17fa  axe.tar.gz" | shasum -a 256 -c
          mkdir -p axe-bin && tar -xzf axe.tar.gz -C axe-bin
          chmod +x axe-bin/axe
          echo "$PWD/axe-bin" >> "$GITHUB_PATH"
          echo "AXe ready $(date +%T)" | tee -a shots/report.txt

      - name: Wait for boot, install the app, grant location
        env:
          DUO_APP_URL: ${{ secrets.DUO_APP_URL }}
        run: |
          xcrun simctl bootstatus "$UDID" -b
          echo "booted $(date +%T)" | tee -a shots/report.txt
          mkdir -p app
          curl -fsSL "$DUO_APP_URL" -o app.tar.gz
          tar -xzf app.tar.gz -C app
          APP=$(find app -maxdepth 3 -name "*.app" -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$APP_ID" >/dev/null 2>&1
          xcrun simctl privacy "$UDID" grant location-always "$APP_ID" >/dev/null 2>&1
          echo "installed $(date +%T)" | tee -a shots/report.txt
          { duoctl --version; axe --version; which axe; } 2>&1 | tee -a shots/report.txt
          echo "DATA=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)" >> "$GITHUB_ENV"
          echo "APPDIR=$(xcrun simctl get_app_container "$UDID" "$APP_ID" app)" >> "$GITHUB_ENV"
          # the first duoctl call is slow: time it, and warm it up
          echo "duoctl state start $(date +%T)" | tee -a shots/report.txt
          duoctl state 2>&1 | tee -a shots/report.txt
          echo "duoctl state end $(date +%T)" | tee -a shots/report.txt
          cat > helpers.sh <<'EOF2'
          R=shots/report.txt
          t() { echo "  $1 $(date +%T)" | tee -a "$R"; }
          shot() { xcrun simctl io "$UDID" screenshot --display="${2:-3}" "shots/$1.png" >/dev/null 2>&1; }
          tap_open() { # "Open in Kiwi Guide?" shows on the first link only: by name, never by position
            if duoctl tap --label "Open" >/dev/null 2>&1; then t "Open prompt tapped"; sleep 2; else t "no Open prompt"; fi
          }
          EOF2

      - name: First launch
        run: |
          set +e
          source helpers.sh
          xcrun simctl launch "$UDID" "$APP_ID" >/dev/null; t "launched"
          # the downloaded update may take a while to land in the app's database
          python3 -I .github/duo/appstate.py update "$DATA" "$APPDIR" --wait 90 | tee -a "$R"
          xcrun simctl terminate "$UDID" "$APP_ID"; t "terminated"
          python3 -I .github/duo/appstate.py count "$DATA" 10 | tee -a "$R"
          xcrun simctl launch "$UDID" "$APP_ID" >/dev/null; t "relaunched"
          sleep 12
          python3 -I .github/duo/appstate.py update "$DATA" "$APPDIR" > shots/update.json
          cat shots/update.json | tee -a "$R"
          xcrun simctl openurl "$UDID" "southislandguide://account"
          sleep 2; tap_open; sleep 3
          shot folded-profile-guest 1

      - name: Sign in (proof only; Task 4 moves it)
        env:
          DUO_TEST_EMAIL: ${{ secrets.DUO_TEST_EMAIL }}
          DUO_TEST_PASSWORD: ${{ secrets.DUO_TEST_PASSWORD }}
        run: |
          set +e
          source helpers.sh
          xcrun simctl terminate "$UDID" "$APP_ID"; t "terminated"
          # output goes straight to the log: it masks the tokens before anything else prints
          python3 -I .github/duo/appstate.py session "$DATA" "$APPDIR" shots/signin.txt
          xcrun simctl launch "$UDID" "$APP_ID" >/dev/null; t "relaunched"
          sleep 12
          xcrun simctl openurl "$UDID" "southislandguide://account"
          sleep 2; tap_open; sleep 3
          shot folded-profile-signed-in 1

      - name: Report
        run: |
          set +e
          R=shots/report.txt
          echo "=== storage names" >> "$R"
          ls -R "$DATA/Library/Application Support" >> "$R" 2>&1
          echo "=== expo db schema" >> "$R"
          DB=$(ls -t "$DATA"/Library/"Application Support"/.expo-internal/expo-v*.db 2>/dev/null | head -1)
          sqlite3 "$DB" .schema >> "$R" 2>&1
          echo "=== embedded app.manifest id" >> "$R"
          python3 -I -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$APPDIR/EXUpdates.bundle/app.manifest" >> "$R" 2>&1
          echo "=== EXUpdatesRuntimeVersion" >> "$R"
          /usr/libexec/PlistBuddy -c "Print :EXUpdatesRuntimeVersion" "$APPDIR/Expo.plist" >> "$R" 2>&1
          echo "=== app.config path" >> "$R"
          find "$APPDIR" -name app.config >> "$R" 2>&1
          cat "$R"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-screens-${{ env.SHORT }}
          path: shots/
          retention-days: 14
