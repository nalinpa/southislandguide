# Throwaway spike (2026-11-23), run 5: the real app (EAS 1.4.0 simulator build, secret DUO_APP_URL)
# on the iPhone Duo simulator. Do its links open on the open Duo, do duoctl taps by testID and by
# label work, can it load live data from GitHub's Mac, and how long does a run take?
# Delete this branch once answered.
name: duo-spike
on:
  push:
    branches: [duo-spike]
  workflow_dispatch:

jobs:
  spike:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      APP_ID: app.blacksands.southislandguide
    steps:
      - name: Pick and boot the iPhone Duo
        run: |
          mkdir -p shots
          echo "start $(date +%T)" | tee shots/report.txt
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          duos = [(r, x['udid']) for r, v in d.items() for x in v if x['name'] == 'iPhone Duo']
          duos.sort(key=lambda t: '27-1' not in t[0])
          print(duos[0][1])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "DUOCTL_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install duoctl and AXe
        run: |
          brew install skarol/tap/duoctl cameroncooke/axe/axe 2>&1 | tail -2
          echo "tools ready $(date +%T)" | tee -a shots/report.txt

      - name: Download and install the app
        env:
          DUO_APP_URL: ${{ secrets.DUO_APP_URL }}
        run: |
          mkdir -p app
          curl -fsSL "$DUO_APP_URL" -o app.tar.gz
          tar -xzf app.tar.gz -C app
          APP=$(find app -maxdepth 3 -name "*.app" -type d | head -1)
          echo "app bundle: $(basename "$APP")" | tee -a shots/report.txt
          xcrun simctl install "$UDID" "$APP"
          echo "installed $(date +%T)" | tee -a shots/report.txt

      - name: First launch, folded
        run: |
          set +e
          xcrun simctl launch "$UDID" "$APP_ID" | tee -a shots/report.txt
          sleep 25
          xcrun simctl io "$UDID" screenshot --display=1 shots/01-folded-first-launch.png >/dev/null 2>&1

      - name: Open, tall (the app's upright Duo layout)
        run: |
          set +e
          R=shots/report.txt
          duoctl open >/dev/null 2>&1; sleep 3; duoctl rotate portrait >/dev/null 2>&1; sleep 5
          { echo "=== state"; duoctl state; } 2>&1 | tee -a "$R"
          xcrun simctl io "$UDID" screenshot --display=3 shots/02-open-tall-as-is.png >/dev/null 2>&1
          { echo "=== elements (open, tall)"; duoctl elements 2>&1 | python3 -c "
          import json, sys
          try:
              for e in json.load(sys.stdin):
                  if e.get('label') or e.get('identifier'):
                      f = e['frame']; print(e['type'], '|', e.get('label'), '|', e.get('identifier'), '|', round(f['x']), round(f['y']), round(f['width']), round(f['height']))
          except Exception as x: print('could not parse elements:', x)
          "; } | tee -a "$R"

      - name: Close the tour by label
        run: |
          set +e
          { echo "=== tap --label Skip tour"; duoctl tap --label "Skip tour" 2>&1; } | tee -a shots/report.txt
          sleep 4
          xcrun simctl io "$UDID" screenshot --display=3 shots/03-after-skip-tour.png >/dev/null 2>&1

      - name: Screens by link, tall
        run: |
          set +e
          for r in sites guide map itinerary account; do
            echo "=== link $r $(date +%T)" | tee -a shots/report.txt
            xcrun simctl openurl "$UDID" "southislandguide://$r" 2>&1 | tee -a shots/report.txt
            sleep 8
            xcrun simctl io "$UDID" screenshot --display=3 "shots/10-tall-$r.png" >/dev/null 2>&1
          done

      - name: Pop-up by testID (guide region picker)
        run: |
          set +e
          xcrun simctl openurl "$UDID" "southislandguide://guide"
          sleep 6
          { echo "=== tap --id region-pill"; duoctl tap --id region-pill 2>&1; } | tee -a shots/report.txt
          sleep 4
          xcrun simctl io "$UDID" screenshot --display=3 shots/20-tall-region-sheet.png >/dev/null 2>&1

      - name: Screens by link, wide (the app's sideways Duo layout)
        run: |
          set +e
          duoctl rotate landscape >/dev/null 2>&1; sleep 5
          for r in sites guide map; do
            xcrun simctl openurl "$UDID" "southislandguide://$r"
            sleep 8
            xcrun simctl io "$UDID" screenshot --display=3 "shots/30-wide-$r.png" >/dev/null 2>&1
          done

      - name: Folded again
        run: |
          set +e
          duoctl close >/dev/null 2>&1; sleep 5
          xcrun simctl openurl "$UDID" "southislandguide://sites"
          sleep 8
          xcrun simctl io "$UDID" screenshot --display=1 shots/40-folded-sites.png >/dev/null 2>&1
          echo "done $(date +%T)" | tee -a shots/report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-spike-5
          path: shots/
