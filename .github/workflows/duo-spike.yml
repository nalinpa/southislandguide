# Throwaway spike (2026-11-24), run 8: run 7 with the app's open count seeded to 10 so the
# App Store review prompt (5th start) never shows, the sim booting while tools install,
# duoctl from its pinned v0.2.1 tarball (sha256 checked) instead of Homebrew, and no token
# in the job. Delete this branch once answered.
name: duo-spike
on:
  push:
    branches: [duo-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      APP_ID: app.blacksands.southislandguide
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - name: Pick the iPhone Duo and start it booting
        run: |
          mkdir -p shots
          echo "start $(date +%T)" | tee shots/report.txt
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          duos = [(r, x['udid']) for r, v in d.items() for x in v if x['name'] == 'iPhone Duo']
          duos.sort(key=lambda t: '27-1' not in t[0])
          print(duos[0][1])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "DUOCTL_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>&1 || true
          echo "boot started $(date +%T)" | tee -a shots/report.txt

      - name: Install duoctl (pinned tarball) and AXe (Homebrew) while the sim boots
        run: |
          curl -fsSL https://github.com/skarol/duoctl/archive/refs/tags/v0.2.1.tar.gz -o duoctl.tar.gz
          echo "32332f5ae653e857e94c845c71a29d6a8056c550cf4f839a51830d0330026f77  duoctl.tar.gz" | shasum -a 256 -c
          mkdir -p duoctl-src && tar -xzf duoctl.tar.gz -C duoctl-src --strip-components 1
          chmod +x duoctl-src/skills/duoctl/scripts/duoctl
          echo "$PWD/duoctl-src/skills/duoctl/scripts" >> "$GITHUB_PATH"
          echo "duoctl ready $(date +%T)" | tee -a shots/report.txt
          brew install cameroncooke/axe/axe 2>&1 | tail -1
          echo "AXe ready $(date +%T)" | tee -a shots/report.txt

      - name: Wait for boot, install the app, grant location
        env:
          DUO_APP_URL: ${{ secrets.DUO_APP_URL }}
        run: |
          xcrun simctl bootstatus "$UDID" -b
          echo "booted $(date +%T)" | tee -a shots/report.txt
          mkdir -p app
          curl -fsSL "$DUO_APP_URL" -o app.tar.gz
          tar -xzf app.tar.gz -C app
          APP=$(find app -maxdepth 3 -name "*.app" -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$APP_ID" >/dev/null 2>&1
          xcrun simctl privacy "$UDID" grant location-always "$APP_ID" >/dev/null 2>&1
          echo "installed $(date +%T)" | tee -a shots/report.txt
          duoctl --version | tee -a shots/report.txt

      - name: Helpers
        run: |
          cat > helpers.sh <<'EOF'
          R=shots/report.txt
          shot() { xcrun simctl io "$UDID" screenshot --display="${2:-3}" "shots/$1.png" >/dev/null 2>&1; }
          size() { duoctl state | python3 -c "import json,sys; s=json.load(sys.stdin)['sizePoints']; print(int(s[0]), int(s[1]))"; }
          tap_open() { # "Open in Kiwi Guide?": by its measured position (proved in run 6)
            read W H < <(size)
            case "$W" in 669) X=408; Y=481;; 951) X=549; Y=341;; *) X=265; Y=345;; esac
            duoctl tap "$X" "$Y" >/dev/null 2>&1
          }
          manifest() { # AsyncStorage's file that holds the open count
            grep -rl "appOpenCount" "$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)/Library" 2>/dev/null | grep manifest.json | head -1
          }
          count() { # print, or with an argument set, the app's open count
            python3 -I - "$(manifest)" "$1" <<'PY'
          import json, sys
          p, new = sys.argv[1], sys.argv[2]
          if not p: print("  open count: no manifest found"); sys.exit()
          m = json.load(open(p)); k = "southislandguide:appOpenCount"
          print("  open count:", m.get(k), "->", new) if new else print("  open count:", m.get(k))
          if new: m[k] = new; json.dump(m, open(p, "w"))
          PY
          }
          go() { # route, shot name, display
            echo "=== link $1 $(date +%T)" | tee -a "$R"
            xcrun simctl openurl "$UDID" "southislandguide://$1"
            sleep 2; tap_open; sleep 4
            shot "$2" "${3:-3}"
          }
          tap_id() { # testID, shot name
            echo "=== tap --id $1 $(date +%T)" | tee -a "$R"
            duoctl tap --id "$1" 2>&1 | tee -a "$R"
            sleep 3; shot "$2"
          }
          dismiss() { # close a pop-up: by a Close/Cancel/Done name, else tap the dim backdrop corner
            for L in "Close" "Cancel" "Done"; do duoctl tap --label "$L" >/dev/null 2>&1 && { echo "  closed by $L" | tee -a "$R"; sleep 2; return; }; done
            duoctl tap 12 140 >/dev/null 2>&1; echo "  closed by backdrop tap" | tee -a "$R"; sleep 2
          }
          EOF

      - name: First launch, seed the open count, relaunch folded, open tall, skip the tour
        run: |
          set +e
          source helpers.sh
          xcrun simctl launch "$UDID" "$APP_ID" >/dev/null
          sleep 15
          xcrun simctl terminate "$UDID" "$APP_ID"
          count 10 | tee -a "$R"
          xcrun simctl launch "$UDID" "$APP_ID" >/dev/null
          sleep 12
          shot 01-folded-first-launch 1
          duoctl open >/dev/null 2>&1; sleep 3; duoctl rotate portrait >/dev/null 2>&1; sleep 4
          { echo "=== tap --label Skip tour $(date +%T)"; duoctl tap --label "Skip tour" 2>&1; } | tee -a "$R"
          sleep 3

      - name: Tall (the app's upright Duo layout)
        run: |
          set +e
          source helpers.sh
          for r in sites guide map itinerary account; do go "$r" "10-tall-$r"; done
          go guide 20-tall-guide
          tap_id region-pill 21-tall-region-sheet
          dismiss; shot 22-tall-after-close
          go sites 23-tall-sites
          tap_id place-add 24-tall-add-to-trip
          dismiss; shot 25-tall-after-close
          count | tee -a "$R"

      - name: Wide (the app's sideways Duo layout)
        run: |
          set +e
          source helpers.sh
          duoctl rotate landscape >/dev/null 2>&1; sleep 4
          for r in sites guide map; do go "$r" "30-wide-$r"; done
          go sites 31-wide-sites-again
          tap_id place-add 32-wide-add-to-trip
          dismiss; shot 33-wide-after-close
          count | tee -a "$R"

      - name: Folded again
        run: |
          set +e
          source helpers.sh
          duoctl close >/dev/null 2>&1; sleep 4
          go sites 40-folded-sites 1
          count | tee -a "$R"
          echo "done $(date +%T)" | tee -a "$R"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-spike-8
          path: shots/
