# Throwaway spike (2026-11-23), run 3: can artemnovichkov/hinge open and rotate the iPhone Duo
# simulator headless on GitHub's Mac, and do Maestro's taps and screenshots work on the open
# (inner) screen? Doesn't build the app. Delete this branch once answered.
name: duo-spike
on:
  push:
    branches: [duo-spike]
  workflow_dispatch:

jobs:
  spike:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - name: Pick and boot the iPhone Duo
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          duos = [(r, x['udid']) for r, v in d.items() for x in v if x['name'] == 'iPhone Duo']
          duos.sort(key=lambda t: '27-1' not in t[0])
          print(duos[0][1])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "HINGE_DEVICE=$UDID" >> "$GITHUB_ENV"
          echo "UDID $UDID" | tee shots/report.txt
          xcrun simctl boot "$UDID" 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b
          sleep 20

      - name: Install hinge (keep a copy of the script to read)
        run: |
          set +e
          brew install artemnovichkov/tap/hinge 2>&1 | tail -5
          { echo "=== hinge"; which hinge; brew info artemnovichkov/tap/hinge 2>&1 | head -8; } | tee -a shots/report.txt
          cp "$(readlink -f "$(which hinge)")" shots/hinge-script.txt 2>/dev/null || cp "$(which hinge)" shots/hinge-script.txt

      - name: Folded, then open
        run: |
          set +e
          R=shots/report.txt
          snap() { xcrun simctl io "$UDID" screenshot --display=1 "shots/$1-outer.png" >/dev/null 2>&1; xcrun simctl io "$UDID" screenshot --display=3 "shots/$1-inner.png" >/dev/null 2>&1; }
          { echo "=== folded posture"; hinge posture --json 2>&1; } | tee -a "$R"
          snap 01-folded
          { echo "=== hinge open"; hinge open 2>&1; } | tee -a "$R"
          sleep 6
          { echo "=== open posture"; hinge posture --json 2>&1; } | tee -a "$R"
          snap 02-open
          { echo "=== devicectl displays"; xcrun devicectl device info displays --device "$UDID" 2>&1 | head -40; } | tee -a "$R"

      - name: Open, sideways
        run: |
          set +e
          R=shots/report.txt
          snap() { xcrun simctl io "$UDID" screenshot --display=1 "shots/$1-outer.png" >/dev/null 2>&1; xcrun simctl io "$UDID" screenshot --display=3 "shots/$1-inner.png" >/dev/null 2>&1; }
          { echo "=== hinge orient landscape-left"; hinge orient landscape-left 2>&1; } | tee -a "$R"
          sleep 6
          { echo "=== sideways posture"; hinge posture --json 2>&1; } | tee -a "$R"
          snap 03-open-sideways
          { echo "=== hinge orient portrait"; hinge orient portrait 2>&1; } | tee -a "$R"
          sleep 6
          snap 04-open-upright-again

      - name: A link opens on the open screen
        run: |
          set +e
          xcrun simctl openurl "$UDID" "https://example.com" 2>&1 | tee -a shots/report.txt
          sleep 8
          xcrun simctl io "$UDID" screenshot --display=3 shots/10-link-inner.png >/dev/null 2>&1

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro on the open screen
        run: |
          set +e
          R=shots/report.txt
          xcrun simctl launch "$UDID" com.apple.mobilesafari 2>&1 | tee -a "$R"
          sleep 5
          xcrun simctl io "$UDID" screenshot --display=3 shots/20-safari-before-tap-inner.png >/dev/null 2>&1
          { echo "=== maestro hierarchy (does it see the inner screen?)"; maestro --device "$UDID" hierarchy 2>&1 | head -150; } | tee -a "$R"
          cat > tap.yaml <<'EOF'
          appId: com.apple.mobilesafari
          ---
          - takeScreenshot: shots/21-maestro-own-shot
          - tapOn:
              text: "Not Now"
              optional: true
          - tapOn:
              text: "Search or enter website"
              optional: true
          - waitForAnimationToEnd
          - takeScreenshot: shots/22-maestro-after-tap
          EOF
          { echo "=== maestro tap flow"; maestro --device "$UDID" test tap.yaml 2>&1; } | tee -a "$R"
          sleep 3
          xcrun simctl io "$UDID" screenshot --display=3 shots/23-safari-after-tap-inner.png >/dev/null 2>&1

      - name: Close again
        if: always()
        run: |
          set +e
          { echo "=== hinge close"; hinge close 2>&1; sleep 6; hinge posture --json 2>&1; } | tee -a shots/report.txt
          xcrun simctl io "$UDID" screenshot --display=1 shots/30-closed-outer.png >/dev/null 2>&1

      - name: Image sizes
        if: always()
        run: sips -g pixelWidth -g pixelHeight shots/*.png 2>&1 | tee -a shots/report.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-spike-3
          path: |
            shots/
            ~/.maestro/tests/
