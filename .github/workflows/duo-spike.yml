# Throwaway spike (2026-11-23), run 4: can skarol/duoctl tap and swipe on the open iPhone Duo's
# inner screen, headless on GitHub's Mac, by coordinates and by accessibility label?
# Doesn't build the app. Delete this branch once answered.
name: duo-spike
on:
  push:
    branches: [duo-spike]
  workflow_dispatch:

jobs:
  spike:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Pick and boot the iPhone Duo
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          duos = [(r, x['udid']) for r, v in d.items() for x in v if x['name'] == 'iPhone Duo']
          duos.sort(key=lambda t: '27-1' not in t[0])
          print(duos[0][1])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "DUOCTL_UDID=$UDID" >> "$GITHUB_ENV"
          echo "UDID $UDID" | tee shots/report.txt
          xcrun simctl boot "$UDID" 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b
          sleep 20

      - name: Install duoctl and AXe (AXe only for --label)
        run: |
          set +e
          brew install skarol/tap/duoctl 2>&1 | tail -3
          brew install cameroncooke/axe/axe 2>&1 | tail -3
          { echo "=== versions"; brew info skarol/tap/duoctl 2>&1 | head -3; which axe; duoctl --help 2>&1 | head -40; } | tee -a shots/report.txt
          cp "$(readlink -f "$(which duoctl)")" shots/duoctl-script.txt 2>/dev/null || true

      - name: Open, wide
        run: |
          set +e
          R=shots/report.txt
          { echo "=== duoctl open"; duoctl open 2>&1; sleep 4; duoctl rotate landscape 2>&1; sleep 4; echo "=== state"; duoctl state 2>&1; } | tee -a "$R"
          xcrun simctl openurl "$UDID" "https://example.com"
          sleep 8
          xcrun simctl io "$UDID" screenshot --display=3 shots/01-page.png >/dev/null 2>&1
          duoctl screenshot shots/01b-page-duoctl.png 2>&1 | tee -a "$R"

      - name: Tap by coordinates (Safari's + button)
        run: |
          set +e
          { echo "=== tap 739 48"; duoctl tap 739 48 2>&1; } | tee -a shots/report.txt
          sleep 4
          xcrun simctl io "$UDID" screenshot --display=3 shots/02-after-tap-plus.png >/dev/null 2>&1

      - name: Swipe (scroll a page)
        run: |
          set +e
          xcrun simctl openurl "$UDID" "https://en.wikipedia.org/wiki/New_Zealand"
          sleep 10
          xcrun simctl io "$UDID" screenshot --display=3 shots/03-before-swipe.png >/dev/null 2>&1
          { echo "=== swipe"; duoctl swipe 475 550 475 150 --duration 0.4 2>&1; } | tee -a shots/report.txt
          sleep 4
          xcrun simctl io "$UDID" screenshot --display=3 shots/04-after-swipe.png >/dev/null 2>&1

      - name: Tap by label
        run: |
          set +e
          R=shots/report.txt
          { echo "=== elements"; duoctl elements 2>&1 | head -80; } | tee -a "$R"
          for L in "Back" "New Tab" "Show Tabs" "Tab Overview" "Tabs"; do
            echo "=== tap --label $L" | tee -a "$R"
            duoctl tap --label "$L" 2>&1 | tee -a "$R"
            sleep 3
            xcrun simctl io "$UDID" screenshot --display=3 "shots/05-label-$(echo "$L" | tr ' ' '-').png" >/dev/null 2>&1
          done

      - name: Tall (the app's upright layout)
        run: |
          set +e
          { echo "=== rotate portrait"; duoctl rotate portrait 2>&1; sleep 4; duoctl state 2>&1; } | tee -a shots/report.txt
          xcrun simctl io "$UDID" screenshot --display=3 shots/06-tall.png >/dev/null 2>&1

      - name: Image sizes
        if: always()
        run: sips -g pixelWidth -g pixelHeight shots/*.png 2>&1 | tee -a shots/report.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-spike-4
          path: shots/
