# Throwaway spike (2026-11-24), run 9: run 8 with "Open in Kiwi Guide?" tapped by name only
# (it shows on the first link only; a tap by position hit the app), no blind taps anywhere,
# AXe from its pinned release file (sha256 checked), timestamps around the slow start, and
# the town and category pickers. Delete this branch once answered.
name: duo-spike
on:
  push:
    branches: [duo-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      APP_ID: app.blacksands.southislandguide
    steps:
      - name: Pick the iPhone Duo and start it booting
        run: |
          mkdir -p shots
          echo "start $(date +%T)" | tee shots/report.txt
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          duos = [(r, x['udid']) for r, v in d.items() for x in v if x['name'] == 'iPhone Duo']
          duos.sort(key=lambda t: '27-1' not in t[0])
          print(duos[0][1])
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "DUOCTL_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>&1 || true
          echo "boot started $(date +%T)" | tee -a shots/report.txt

      - name: Install duoctl and AXe (pinned files, sha256 checked) while the sim boots
        run: |
          curl -fsSL https://github.com/skarol/duoctl/archive/refs/tags/v0.2.1.tar.gz -o duoctl.tar.gz
          echo "32332f5ae653e857e94c845c71a29d6a8056c550cf4f839a51830d0330026f77  duoctl.tar.gz" | shasum -a 256 -c
          mkdir -p duoctl-src && tar -xzf duoctl.tar.gz -C duoctl-src --strip-components 1
          chmod +x duoctl-src/skills/duoctl/scripts/duoctl
          echo "$PWD/duoctl-src/skills/duoctl/scripts" >> "$GITHUB_PATH"
          echo "duoctl ready $(date +%T)" | tee -a shots/report.txt
          curl -fsSL https://github.com/cameroncooke/AXe/releases/download/v2.1.1/AXe-macOS-v2.1.1-universal.tar.gz -o axe.tar.gz
          echo "8788838b1b32059d143cf06541b72fcaead85c16274457cdbff086510a5b17fa  axe.tar.gz" | shasum -a 256 -c
          mkdir -p axe-bin && tar -xzf axe.tar.gz -C axe-bin
          chmod +x axe-bin/axe
          echo "$PWD/axe-bin" >> "$GITHUB_PATH"
          echo "AXe ready $(date +%T)" | tee -a shots/report.txt

      - name: Wait for boot, install the app, grant location
        env:
          DUO_APP_URL: ${{ secrets.DUO_APP_URL }}
        run: |
          xcrun simctl bootstatus "$UDID" -b
          echo "booted $(date +%T)" | tee -a shots/report.txt
          mkdir -p app
          curl -fsSL "$DUO_APP_URL" -o app.tar.gz
          tar -xzf app.tar.gz -C app
          APP=$(find app -maxdepth 3 -name "*.app" -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$APP_ID" >/dev/null 2>&1
          xcrun simctl privacy "$UDID" grant location-always "$APP_ID" >/dev/null 2>&1
          echo "installed $(date +%T)" | tee -a shots/report.txt
          { duoctl --version; axe --version; which axe; } 2>&1 | tee -a shots/report.txt

      - name: Helpers
        run: |
          cat > helpers.sh <<'EOF'
          R=shots/report.txt
          t() { echo "  $1 $(date +%T)" | tee -a "$R"; }
          shot() { xcrun simctl io "$UDID" screenshot --display="${2:-3}" "shots/$1.png" >/dev/null 2>&1; }
          tap_open() { # "Open in Kiwi Guide?" shows on the first link only: by name, never by position
            if duoctl tap --label "Open" >/dev/null 2>&1; then t "Open prompt tapped"; sleep 2; else t "no Open prompt"; fi
          }
          manifest() { # AsyncStorage's file that holds the open count
            grep -rl "appOpenCount" "$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)/Library" 2>/dev/null | grep manifest.json | head -1
          }
          count() { # print, or with an argument set, the app's open count
            python3 -I - "$(manifest)" "$1" <<'PY'
          import json, sys
          p, new = sys.argv[1], sys.argv[2]
          if not p: print("  open count: no manifest found"); sys.exit()
          m = json.load(open(p)); k = "southislandguide:appOpenCount"
          print("  open count:", m.get(k), "->", new) if new else print("  open count:", m.get(k))
          if new: m[k] = new; json.dump(m, open(p, "w"))
          PY
          }
          go() { # route, shot name, display
            echo "=== link $1 $(date +%T)" | tee -a "$R"
            xcrun simctl openurl "$UDID" "southislandguide://$1"
            sleep 2; tap_open; sleep 3
            shot "$2" "${3:-3}"
          }
          tap_id() { # testID, shot name
            echo "=== tap --id $1 $(date +%T)" | tee -a "$R"
            duoctl tap --id "$1" 2>&1 | tee -a "$R"
            sleep 3; shot "$2"
          }
          tap_label() { # accessibility label, shot name
            echo "=== tap --label $1 $(date +%T)" | tee -a "$R"
            duoctl tap --label "$1" 2>&1 | tee -a "$R"
            sleep 3; shot "$2"
          }
          dismiss() { # close a pop-up or alert by its Close/Cancel/Done name; no blind taps
            for L in "Close" "Cancel" "Done"; do duoctl tap --label "$L" >/dev/null 2>&1 && { echo "  closed by $L" | tee -a "$R"; sleep 2; return; }; done
            echo "  nothing to close" | tee -a "$R"
          }
          EOF

      - name: First launch, seed the open count, relaunch folded, open tall
        run: |
          set +e
          source helpers.sh
          xcrun simctl launch "$UDID" "$APP_ID" >/dev/null; t "launched"
          sleep 15
          xcrun simctl terminate "$UDID" "$APP_ID"; t "terminated"
          count 10 | tee -a "$R"
          xcrun simctl launch "$UDID" "$APP_ID" >/dev/null; t "relaunched"
          sleep 12
          shot 01-folded-first-launch 1; t "folded shot"
          duoctl open >/dev/null 2>&1; t "duoctl open"
          sleep 3
          duoctl rotate portrait >/dev/null 2>&1; t "duoctl rotate portrait"
          sleep 4
          duoctl tap --label "Skip tour" >/dev/null 2>&1 && t "tour skipped" || t "no tour"

      - name: Tall (the app's upright Duo layout)
        run: |
          set +e
          source helpers.sh
          for r in sites guide map itinerary account; do go "$r" "10-tall-$r"; done
          go guide 20-tall-guide
          tap_id region-pill 21-tall-region-sheet
          dismiss; shot 22-tall-after-close
          go sites 23-tall-sites
          tap_id place-add 24-tall-add-to-trip
          dismiss
          tap_label "Queenstown, choose a town" 25-tall-town-picker
          dismiss
          tap_label "All, choose a category" 26-tall-category-picker
          dismiss; shot 27-tall-after-close
          count | tee -a "$R"

      - name: Wide (the app's sideways Duo layout)
        run: |
          set +e
          source helpers.sh
          duoctl rotate landscape >/dev/null 2>&1; sleep 4
          for r in sites guide map; do go "$r" "30-wide-$r"; done
          go guide 31-wide-guide-again
          tap_id region-pill 32-wide-region-sheet
          dismiss
          go sites 33-wide-sites-again
          tap_id place-add 34-wide-add-to-trip
          dismiss
          tap_label "Queenstown, choose a town" 35-wide-town-picker
          dismiss
          tap_label "All, choose a category" 36-wide-category-picker
          dismiss; shot 37-wide-after-close
          count | tee -a "$R"

      - name: Folded again
        run: |
          set +e
          source helpers.sh
          duoctl close >/dev/null 2>&1; sleep 4
          go sites 40-folded-sites 1
          count | tee -a "$R"
          echo "done $(date +%T)" | tee -a "$R"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-spike-9
          path: shots/
